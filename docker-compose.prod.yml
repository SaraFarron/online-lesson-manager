# docker-compose.prod.yml — production deployment
#
# All secrets MUST be supplied via environment variables or a secrets manager.
# Do NOT commit a .env file with real credentials to version control.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_EXP_MINUTES: ${AUTH_JWT_EXP_MINUTES:-30}
      TELEGRAM_SERVICE_CREDENTIAL: ${TELEGRAM_SERVICE_CREDENTIAL:?Set TELEGRAM_SERVICE_CREDENTIAL}
      HOMEWORK_STORAGE_PATH: /var/lib/olm/homework
    volumes:
      - homework_data:/var/lib/olm/homework
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    profiles: ["bot"]
    command: ["python", "-m", "telegram"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      BOT_BACKEND_URL: ${BOT_COMPOSE_BACKEND_URL:-http://app:8000}
      BOT_SERVICE_CREDENTIAL: ${TELEGRAM_SERVICE_CREDENTIAL:?Set TELEGRAM_SERVICE_CREDENTIAL}
      BOT_REQUEST_TIMEOUT: ${BOT_REQUEST_TIMEOUT:-10}
      BOT_RECOVERY_SECONDS: ${BOT_RECOVERY_SECONDS:-15}
      BOT_FAILURE_THRESHOLD: ${BOT_FAILURE_THRESHOLD:-3}

volumes:
  homework_data:
  postgres_data:
