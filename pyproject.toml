[project]
name = "OLM"
version = "0.1.0"
description = "Online Lesson Manager: scheduling system for online tutors"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    "email-validator>=2.1.0.post1,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "aiosqlite>=0.20.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused function arguments
    "T201",   # no print statements
]
ignore = [
    "E501", # line too long (formatter handles it)
    "B008", # no function calls in argument defaults (Depends)
    "W191", # tabs
    "B904", # raise from in except (we use HTTPException directly)
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

# ── FastAPI entrypoint (for tooling) ──────────────────────────────────────────
[tool.fastapi]
entrypoint = "backend.main:app"
