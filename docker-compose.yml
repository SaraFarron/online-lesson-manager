# docker-compose.yml — local development with PostgreSQL
#
# Usage:
#   docker compose up -d db        # start only the database
#   docker compose up               # start database + app
#
# Configuration is interpolated from .env, or --env-file .env.docker.
# For quick local dev without Docker use SQLite (.env → dev.db).

name: online-lesson-manager-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      SCHEDULE_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_JWT_EXP_MINUTES: ${AUTH_JWT_EXP_MINUTES:-30}
      TELEGRAM_SERVICE_CREDENTIAL: ${TELEGRAM_SERVICE_CREDENTIAL:?Set TELEGRAM_SERVICE_CREDENTIAL}
      HOMEWORK_STORAGE_PATH: /var/lib/olm/homework
    volumes:
      - ./backend:/app/backend
      - ./telegram:/app/telegram
      - ./templates:/app/templates
      - ./static:/app/static
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - homework_data:/var/lib/olm/homework
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    profiles: ["bot"]
    command: ["python", "-m", "telegram"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      BOT_BACKEND_URL: ${BOT_COMPOSE_BACKEND_URL:-http://app:8000}
      BOT_SERVICE_CREDENTIAL: ${TELEGRAM_SERVICE_CREDENTIAL:?Set TELEGRAM_SERVICE_CREDENTIAL}
      BOT_REQUEST_TIMEOUT: ${BOT_REQUEST_TIMEOUT:-10}
      BOT_RECOVERY_SECONDS: ${BOT_RECOVERY_SECONDS:-15}
      BOT_FAILURE_THRESHOLD: ${BOT_FAILURE_THRESHOLD:-3}

volumes:
  homework_data:
  postgres_data:
